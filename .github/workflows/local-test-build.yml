name: Local Windows test build

on:
  push:
    branches: [fix/live-whisper-turbo]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nexq-local-test-windows
          path: |
            src-tauri/target/release/nexq.exe
            src-tauri/ort/*.dll
          if-no-files-found: error
