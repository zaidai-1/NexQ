name: Local Windows test build

on:
  push:
    branches: [fix/live-whisper-turbo]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      NEXQ_MANAGED_LOCAL_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable
      - run: npm ci
      - run: node scripts/test-question-identity.mjs
      - run: node scripts/test-remote-question.mjs
      - run: node scripts/test-meeting-shortcut.mjs
      - run: node scripts/test-interview-question-routing.mjs
      - run: python scripts/test-gpu-whisper-diagnostics.py
      - run: npm run tauri build -- --no-bundle
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib assist_warmup
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib single_instance
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib timing
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib question_routing
      - uses: actions/upload-artifact@v4
        with:
          name: nexq-local-test-windows
          path: |
            src-tauri/target/release/nexq.exe
            src-tauri/ort/*.dll
          if-no-files-found: error
